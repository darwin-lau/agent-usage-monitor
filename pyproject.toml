[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-usage-monitor"
version = "0.2.0"
description = "Privacy-first token usage monitor for mainstream coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["claude-code", "codex", "opencode", "token-usage", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastapi>=0.115",
    "rich>=13.7",
    "textual>=1.0",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Darwin-lfl/agent-usage-monitor"
Repository = "https://github.com/Darwin-lfl/agent-usage-monitor.git"
Issues = "https://github.com/Darwin-lfl/agent-usage-monitor/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pyinstaller>=6.10", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agent-monitor = "agent_usage_monitor.cli:main"
amon = "agent_usage_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_usage_monitor = ["web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
